name: CI

# Wired but DEFERRED (ADR 0010). Every job is gated on the repository variable
# CI_ENABLED. Until you set `CI_ENABLED=true` in repo settings, jobs are skipped and
# consume no Actions minutes. Local `pnpm verify` + Husky hooks enforce the same gates
# in the meantime.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + boundaries
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test -- --coverage

  mutation:
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation test (domain core)
        run: pnpm test:mutation

  build-web:
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (PWA)
        run: pnpm --filter @subtrackr/mobile build:web

  e2e-web:
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright E2E (web)
        run: pnpm e2e:web
