name: Release

# Wired but DEFERRED (ADR 0010). Gated on CI_ENABLED. Store submission is further gated
# on the presence of signing secrets, so it stays off until developer accounts exist.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Release PR / publish versions (Changesets)
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-mobile:
    # Off until store credentials exist: skipped when EXPO_TOKEN is unset.
    if: vars.CI_ENABLED == 'true' && vars.STORE_SUBMIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: EAS build & submit (gated)
        run: echo "EAS build/submit runs here once EXPO_TOKEN and store secrets are set."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
